name: Real Open ECG Header Audit

on:
  workflow_dispatch:
  push:
    branches: [open-ecg-transportability]
    paths:
      - ".github/workflows/open-ecg-real-header-audit.yml"
      - "scripts/fetch_open_ecg_headers.py"
      - "scripts/prepare_open_ecg_data.py"
      - "scripts/audit_original_ptbxl_labels.py"
      - "scripts/lock_open_ecg_labels.py"
      - "src/trust_icu/ecg_data.py"
      - "src/trust_icu/ecg_manifest.py"
      - "src/trust_icu/ecg_ptbxl_labels.py"
      - "schemas/open_ecg_protocol.yaml"
      - "schemas/challenge2020_scored_classes.csv"

permissions:
  contents: read

concurrency:
  group: trust-ecg-real-header-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  real-header-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install audit runtime
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Fetch Challenge headers and PTB-XL metadata only
        run: |
          set -euo pipefail
          rm -rf /tmp/trust_ecg_public
          mkdir -p /tmp/trust_ecg_public
          curl --fail --location --retry 8 --retry-all-errors --retry-delay 2 \
            --output /tmp/trust_ecg_public/ptbxl_database.csv \
            https://physionet.org/files/ptb-xl/1.0.1/ptbxl_database.csv
          test -s /tmp/trust_ecg_public/ptbxl_database.csv
          python scripts/fetch_open_ecg_headers.py \
            --output-root /tmp/trust_ecg_public \
            --workers 8 \
            --recovery-rounds 4 \
            --skip-original-ptbxl-headers \
            --summary /tmp/trust_ecg_public/header_download_summary.json
          echo "--- aggregate download summary ---"
          cat /tmp/trust_ecg_public/header_download_summary.json

      - name: Build real Challenge label-support audit
        run: |
          set -euo pipefail
          python scripts/prepare_open_ecg_data.py \
            --header-root /tmp/trust_ecg_public/challenge \
            --ptbxl-metadata /tmp/trust_ecg_public/ptbxl_database.csv \
            --output /tmp/trust_ecg_public/open_ecg_header_audit.json \
            --require-ready

      - name: Build real original PTB-XL label-concordance audit
        run: |
          set -euo pipefail
          python scripts/audit_original_ptbxl_labels.py \
            --ptbxl-metadata /tmp/trust_ecg_public/ptbxl_database.csv \
            --output /tmp/trust_ecg_public/ptbxl_label_concordance_audit.json \
            --require-ready

      - name: Lock real two-source seven-label manifest
        run: |
          set -euo pipefail
          python scripts/lock_open_ecg_labels.py \
            --header-audit /tmp/trust_ecg_public/open_ecg_header_audit.json \
            --ptbxl-label-concordance /tmp/trust_ecg_public/ptbxl_label_concordance_audit.json \
            --output /tmp/trust_ecg_public/open_ecg_label_manifest.json

      - name: Verify aggregate-only evidence chain
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path('/tmp/trust_ecg_public')
          download = json.loads((root / 'header_download_summary.json').read_text())
          header = json.loads((root / 'open_ecg_header_audit.json').read_text())
          concordance = json.loads((root / 'ptbxl_label_concordance_audit.json').read_text())
          manifest = json.loads((root / 'open_ecg_label_manifest.json').read_text())
          assert download['waveform_files_downloaded'] == 0
          assert download['metadata_source'] == 'prefetched_reused'
          assert download['ptbxl_original_headers_requested'] is False
          assert download['ptbxl_original_header_files'] == 0
          assert header['ready_for_waveform_stage'] is True
          assert header['ptbxl_crosswalk']['required'] is False
          assert concordance['ready_for_original_ptbxl_development'] is True
          assert concordance['all_labels_exactly_concordant'] is True
          assert manifest['challenge_ptbxl_model_input'] is False
          assert manifest['label_count'] == 7
          assert manifest['source_header_audit_sha256'] == header['manifest_sha256']
          assert manifest['ptbxl_label_concordance_audit_sha256'] == concordance['audit_sha256']
          print(json.dumps({
              'challenge_header_counts': download['challenge_downloaded_counts'],
              'metadata_source': download['metadata_source'],
              'waveform_files_downloaded': download['waveform_files_downloaded'],
              'original_ptbxl_headers_downloaded_for_crosswalk': download['ptbxl_original_header_files'],
              'header_audit_sha256': header['manifest_sha256'],
              'ptbxl_label_concordance_audit_sha256': concordance['audit_sha256'],
              'label_count': manifest['label_count'],
              'canonical_codes': [item['canonical_code'] for item in manifest['labels']],
              'label_manifest_sha256': manifest['manifest_sha256'],
              'challenge_ptbxl_model_input': manifest['challenge_ptbxl_model_input'],
          }, indent=2, sort_keys=True))
          PY

      - name: Record aggregate evidence in job summary
        if: always()
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path('/tmp/trust_ecg_public')
          summary = Path(os.environ['GITHUB_STEP_SUMMARY'])
          lines = ['# TRUST-ECG v0.4 real two-source label lock', '']
          download_path = root / 'header_download_summary.json'
          if download_path.is_file():
              payload = json.loads(download_path.read_text())
              lines += [
                  f"- Challenge v{payload['challenge_version']} header counts: `{payload['challenge_downloaded_counts']}`",
                  f"- Metadata source: `{payload['metadata_source']}`",
                  f"- Waveform files downloaded: **{payload['waveform_files_downloaded']}**",
                  f"- Original PTB-XL headers fetched for reverse crosswalk: **{payload['ptbxl_original_header_files']}**",
              ]
          header_path = root / 'open_ecg_header_audit.json'
          if header_path.is_file():
              payload = json.loads(header_path.read_text())
              lines += [
                  f"- Challenge label-support ready: **{payload['ready_for_waveform_stage']}**",
                  f"- Eligible labels: `{payload['eligible_labels']}`",
                  f"- Header audit SHA-256: `{payload['manifest_sha256']}`",
              ]
          concordance_path = root / 'ptbxl_label_concordance_audit.json'
          if concordance_path.is_file():
              payload = json.loads(concordance_path.read_text())
              lines += [
                  f"- Original PTB-XL label concordance ready: **{payload['ready_for_original_ptbxl_development']}**",
                  f"- All seven labels exactly concordant: **{payload['all_labels_exactly_concordant']}**",
                  f"- PTB-XL concordance SHA-256: `{payload['audit_sha256']}`",
              ]
          manifest_path = root / 'open_ecg_label_manifest.json'
          if manifest_path.is_file():
              payload = json.loads(manifest_path.read_text())
              lines += [
                  f"- Locked label count: **{payload['label_count']}**",
                  f"- Challenge PTB-XL used as model input: **{payload['challenge_ptbxl_model_input']}**",
                  f"- Label manifest SHA-256: `{payload['manifest_sha256']}`",
              ]
          summary.write_text('\n'.join(lines) + '\n')
          PY
