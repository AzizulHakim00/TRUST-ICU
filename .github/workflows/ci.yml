name: Phase 0 CI

on:
  push:
    branches: [main, phase-0-feasibility, open-ecg-transportability]
  pull_request:

permissions:
  contents: read

concurrency:
  group: trust-icu-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: python -m pip install --upgrade pip && pip install -e ".[dev,phase0,reporting]"
      - name: Lint
        run: ruff check src tests scripts
      - name: Validate public outcome contracts
        run: python scripts/validate_outcome_contracts.py
      - name: Validate outcome evidence template JSON
        run: python -m json.tool templates/outcome_validation_evidence.template.json >/dev/null
      - name: Validate public feature contract
        run: python scripts/validate_phase0_features.py
      - name: Validate source-adapter contract
        run: python scripts/validate_source_adapter_contract.py
      - name: Validate source-adapter manifest
        run: python scripts/validate_source_adapter_manifest.py
      - name: Validate credentialed execution plans
        run: |
          python scripts/run_credentialed_extract.py --dataset mimic_iv_3_1 --dry-run
          python scripts/run_credentialed_extract.py --dataset eicu_crd_2_0 --dry-run
      - name: Validate Phase 0 baseline plan
        run: python scripts/run_phase0_baselines.py --dry-run
      - name: Validate publication reporting plan
        run: python scripts/generate_publication_bundle.py --dry-run
      - name: Validate conditional Phase 1 plan
        run: python scripts/validate_phase1_plan.py
      - name: Validate open ECG transportability protocol
        run: python scripts/validate_open_ecg_protocol.py
      - name: Validate real open ECG header fetch plan
        run: python scripts/fetch_open_ecg_headers.py --dry-run
      - name: Validate PTB-XL crosswalk diagnostic plan
        run: python scripts/diagnose_ptbxl_crosswalk.py --dry-run
      - name: Validate open ECG data preparation plan
        run: python scripts/prepare_open_ecg_data.py --dry-run
      - name: Validate open ECG label-lock plan
        run: python scripts/lock_open_ecg_labels.py --dry-run
      - name: Validate open ECG waveform-stage plan
        run: python scripts/prepare_open_ecg_waveforms.py --dry-run
      - name: Validate open ECG model-index plan
        run: python scripts/build_open_ecg_model_index.py --dry-run
      - name: Validate locked open ECG baseline plan
        run: python scripts/validate_open_ecg_baseline_plan.py
      - name: Validate open ECG Phase 0 execution plans
        run: |
          python scripts/run_open_ecg_phase0.py --model logistic --dry-run
          python scripts/run_open_ecg_phase0.py --model resnet --dry-run
      - name: Test
        run: pytest --cov=trust_icu --cov-report=term-missing
      - name: Synthetic end-to-end dry-run
        run: python scripts/run_synthetic_phase0.py --n 600 --output /tmp/trust_icu_synthetic_report.json
