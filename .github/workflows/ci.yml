name: Phase 0 CI

on:
  push:
    branches: [main, phase-0-feasibility]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: python -m pip install --upgrade pip && pip install -e ".[dev]"
      - name: Lint
        run: ruff check src tests scripts
      - name: Test
        run: pytest --cov=trust_icu --cov-report=term-missing
