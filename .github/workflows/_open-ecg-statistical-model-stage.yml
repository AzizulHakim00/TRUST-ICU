name: TRUST-ECG statistical model-comparison stage

on:
  workflow_call:
    inputs:
      result_cache_key: {required: true, type: string}
      expected_head_sha: {required: true, type: string}
      launch_token: {required: true, type: string}

permissions:
  contents: read
  actions: write

jobs:
  model_comparison:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      ACTIVATION_PATH: triggers/open-ecg-resnet-phase0/activation.json
      DATA_ROOT: ${{ github.workspace }}/.trust_ecg_runtime/primary
      EVIDENCE_ROOT: ${{ github.workspace }}/.trust_ecg_runtime/evidence
      WORK_ROOT: ${{ github.workspace }}/.trust_ecg_runtime/work
      RESULTS_ROOT: ${{ github.workspace }}/.trust_ecg_runtime/results
      STAGE_ROOT: ${{ github.workspace }}/.trust_ecg_runtime/statistical_model_stage

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.expected_head_sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Guard frozen Phase 0 and derive verified-data key
        id: frozen
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_SHA" = "${{ inputs.expected_head_sha }}"
          python scripts/validate_open_ecg_resnet_activation.py --activation "$ACTIVATION_PATH"
          LOGISTIC_SHA=$(python -c 'import json,os; print(json.load(open(os.environ["ACTIVATION_PATH"]))["logistic_head_sha"])')
          phase0_protected=(
            pyproject.toml schemas/open_ecg_protocol.yaml
            src/trust_icu/ecg_baseline.py src/trust_icu/ecg_index.py src/trust_icu/ecg_manifest.py
            src/trust_icu/ecg_phase0.py src/trust_icu/ecg_phase0_v04.py
            src/trust_icu/ecg_deep_phase0.py src/trust_icu/ecg_deep_phase0_v04.py
            src/trust_icu/ecg_resnet.py src/trust_icu/ecg_signal.py src/trust_icu/ecg_waveform.py
            scripts/audit_original_ptbxl_labels.py scripts/build_open_ecg_model_index.py
            scripts/fetch_open_ecg_headers.py scripts/fetch_open_ecg_primary_waveforms_v04.py
            scripts/lock_open_ecg_labels.py scripts/prepare_open_ecg_data.py
            scripts/prepare_open_ecg_waveforms.py scripts/run_open_ecg_phase0.py
          )
          git diff --quiet "$LOGISTIC_SHA" "$GITHUB_SHA" -- "${phase0_protected[@]}" || {
            echo "Frozen Phase 0 implementation drift detected." >&2
            exit 1
          }
          python - "$ACTIVATION_PATH" "$GITHUB_OUTPUT" <<'PY'
          import json, sys
          from pathlib import Path
          payload = json.loads(Path(sys.argv[1]).read_text())
          key = "trust-ecg-v04-verified-data-" + payload["label_manifest_sha256"][:16] + "-" + payload["waveform_audit_sha256"][:16] + "-" + payload["model_index_audit_sha256"][:16]
          with Path(sys.argv[2]).open("a", encoding="utf-8") as handle:
              handle.write(f"data_cache_key={key}\n")
          PY

      - uses: actions/cache/restore@v4
        with:
          path: |
            .trust_ecg_runtime/primary
            .trust_ecg_runtime/evidence
            .trust_ecg_runtime/work
          key: ${{ steps.frozen.outputs.data_cache_key }}
          fail-on-cache-miss: true

      - uses: actions/cache/restore@v4
        with:
          path: .trust_ecg_runtime/results
          key: ${{ inputs.result_cache_key }}
          fail-on-cache-miss: true

      - name: Install deterministic CPU analysis runtime
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu "torch==2.13.0"
          pip install -e ".[ecg-deep,reporting]"
          python - <<'PY'
          import torch
          if torch.cuda.is_available():
              raise SystemExit("Statistical stage must remain CPU-only.")
          PY

      - name: Verify completed primary state
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          root = Path(os.environ["RESULTS_ROOT"])
          required = ["open_ecg_phase0_resnet_report.json", "open_ecg_resnet_checkpoint.pt", "open_ecg_resnet_calibration.json", "open_ecg_resnet_training_history.json"]
          for name in required:
              if not (root / name).is_file(): raise SystemExit(f"Missing completed primary file: {name}")
          report = json.loads((root / required[0]).read_text())
          expected = ["59118001", "164889003", "164909002", "270492004", "284470004", "426783006", "427084000"]
          if report["primary_gate_eligible"] is not True: raise SystemExit("Primary model is not gate eligible.")
          if report["external_recovery_pool_used"] is not False: raise SystemExit("Recovery-pool contamination detected in Phase 0.")
          if report["label_codes"] != expected: raise SystemExit("Locked label order changed.")
          PY

      - name: Run aggregate-only model comparison
        run: |
          set -euo pipefail
          rm -rf "$STAGE_ROOT" && mkdir -p "$STAGE_ROOT"
          python scripts/run_open_ecg_statistical_model_stage.py \
            --phase0-report "$RESULTS_ROOT/open_ecg_phase0_resnet_report.json" \
            --primary-data-root "$DATA_ROOT" \
            --model-index "$WORK_ROOT/model_index/open_ecg_model_index.csv" \
            --model-index-audit "$WORK_ROOT/model_index/open_ecg_model_index_audit.json" \
            --label-manifest "$EVIDENCE_ROOT/open_ecg_label_manifest.json" \
            --normalization-stats "$WORK_ROOT/waveform/open_ecg_normalization_stats.json" \
            --checkpoint "$RESULTS_ROOT/open_ecg_resnet_checkpoint.pt" \
            --global-calibration "$RESULTS_ROOT/open_ecg_resnet_calibration.json" \
            --output-root "$STAGE_ROOT" --bootstrap-repeats 2000 --calibration-bins 10 \
            --device cpu --num-workers 0

      - uses: actions/upload-artifact@v4
        with:
          name: trust-ecg-model-statistics-${{ inputs.launch_token }}
          path: .trust_ecg_runtime/statistical_model_stage
          if-no-files-found: error
          retention-days: 30
