name: Real TRUST-ECG v0.4 Resumable Fixed ResNet

on:
  push:
    branches: [open-ecg-transportability]
    paths:
      - "triggers/open-ecg-resnet-resumable/**"
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: trust-ecg-v04-resumable-${{ github.ref }}
  cancel-in-progress: false

jobs:
  segment_01:
    uses: ./.github/workflows/_open-ecg-resnet-resume-segment.yml
    with:
      segment_number: "1"
      incoming_complete: "false"
      incoming_cache_key: ""
      incoming_result_cache_key: ""
      expected_head_sha: ${{ github.sha }}
      launch_token: ${{ github.run_id }}

  segment_02:
    needs: segment_01
    if: ${{ always() && needs.segment_01.result == 'success' }}
    uses: ./.github/workflows/_open-ecg-resnet-resume-segment.yml
    with:
      segment_number: "2"
      incoming_complete: ${{ needs.segment_01.outputs.complete }}
      incoming_cache_key: ${{ needs.segment_01.outputs.next_cache_key }}
      incoming_result_cache_key: ${{ needs.segment_01.outputs.result_cache_key }}
      expected_head_sha: ${{ github.sha }}
      launch_token: ${{ github.run_id }}

