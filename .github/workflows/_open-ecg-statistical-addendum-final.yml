name: TRUST-ECG v0.4 Statistical Addendum Final

on:
  workflow_call:
    inputs:
      result_cache_key:
        required: true
        type: string
      expected_head_sha:
        required: true
        type: string
      launch_token:
        required: true
        type: string

permissions:
  contents: read
  actions: write

jobs:
  statistical_model_comparison:
    uses: ./.github/workflows/_open-ecg-statistical-model-stage.yml
    with:
      result_cache_key: ${{ inputs.result_cache_key }}
      expected_head_sha: ${{ inputs.expected_head_sha }}
      launch_token: ${{ inputs.launch_token }}

  statistical_phase1_matched:
    uses: ./.github/workflows/_open-ecg-statistical-phase1-stage.yml
    with:
      result_cache_key: ${{ inputs.result_cache_key }}
      expected_head_sha: ${{ inputs.expected_head_sha }}
      launch_token: ${{ inputs.launch_token }}

  statistical_addendum_assemble:
    needs: [statistical_model_comparison, statistical_phase1_matched]
    if: ${{ always() && needs.statistical_model_comparison.result == 'success' && needs.statistical_phase1_matched.result == 'success' }}
    uses: ./.github/workflows/_open-ecg-statistical-assemble.yml
    with:
      result_cache_key: ${{ inputs.result_cache_key }}
      expected_head_sha: ${{ inputs.expected_head_sha }}
      launch_token: ${{ inputs.launch_token }}
