name: TRUST-ECG v0.4 Statistical Addendum Final

on:
  workflow_call:
    inputs:
      result_cache_key:
        required: true
        type: string
      expected_head_sha:
        required: true
        type: string
      launch_token:
        required: true
        type: string

permissions:
  contents: read
  actions: write

jobs:
  statistical_addendum:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      ACTIVATION_PATH: triggers/open-ecg-resnet-phase0/activation.json
      RUNTIME_ROOT: ${{ github.workspace }}/.trust_ecg_runtime
      DATA_ROOT: ${{ github.workspace }}/.trust_ecg_runtime/primary
      EVIDENCE_ROOT: ${{ github.workspace }}/.trust_ecg_runtime/evidence
      WORK_ROOT: ${{ github.workspace }}/.trust_ecg_runtime/work
      RESULTS_ROOT: ${{ github.workspace }}/.trust_ecg_runtime/results
      ADDENDUM_ROOT: ${{ github.workspace }}/.trust_ecg_runtime/statistical_addendum
      PHASE1_LOCK_SHA: 4b5189d693ddd9ede6715cc3210b9157972144e2

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.expected_head_sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Guard frozen scientific state and derive verified-data key
        id: frozen
        run: |
          set -euo pipefail
          test "$GITHUB_SHA" = "${{ inputs.expected_head_sha }}"
          python scripts/validate_open_ecg_resnet_activation.py --activation "$ACTIVATION_PATH"
          LOGISTIC_SHA=$(python -c 'import json,os; print(json.load(open(os.environ["ACTIVATION_PATH"]))["logistic_head_sha"])')
          phase0_protected=(
            pyproject.toml schemas/open_ecg_protocol.yaml
            src/trust_icu/ecg_baseline.py src/trust_icu/ecg_index.py src/trust_icu/ecg_manifest.py
            src/trust_icu/ecg_phase0.py src/trust_icu/ecg_phase0_v04.py
            src/trust_icu/ecg_deep_phase0.py src/trust_icu/ecg_deep_phase0_v04.py
            src/trust_icu/ecg_resnet.py src/trust_icu/ecg_signal.py src/trust_icu/ecg_waveform.py
            scripts/audit_original_ptbxl_labels.py scripts/build_open_ecg_model_index.py
            scripts/fetch_open_ecg_headers.py scripts/fetch_open_ecg_primary_waveforms_v04.py
            scripts/lock_open_ecg_labels.py scripts/prepare_open_ecg_data.py
            scripts/prepare_open_ecg_waveforms.py scripts/run_open_ecg_phase0.py
          )
          git diff --quiet "$LOGISTIC_SHA" "$GITHUB_SHA" -- "${phase0_protected[@]}" || {
            echo "Frozen Phase 0 implementation drift detected." >&2
            git diff --name-only "$LOGISTIC_SHA" "$GITHUB_SHA" -- "${phase0_protected[@]}" >&2
            exit 1
          }
          phase1_protected=(src/trust_icu/ecg_phase1.py scripts/run_open_ecg_phase1.py)
          git diff --quiet "$PHASE1_LOCK_SHA" "$GITHUB_SHA" -- "${phase1_protected[@]}" || {
            echo "Frozen Phase 1 implementation drift detected." >&2
            exit 1
          }
          python - "$ACTIVATION_PATH" "$GITHUB_OUTPUT" <<'PY'
          import json, sys
          from pathlib import Path
          payload = json.loads(Path(sys.argv[1]).read_text())
          key = (
              "trust-ecg-v04-verified-data-"
              + payload["label_manifest_sha256"][:16] + "-"
              + payload["waveform_audit_sha256"][:16] + "-"
              + payload["model_index_audit_sha256"][:16]
          )
          with Path(sys.argv[2]).open("a", encoding="utf-8") as handle:
              handle.write(f"data_cache_key={key}\n")
          PY

      - name: Restore exact verified data
        uses: actions/cache/restore@v4
        with:
          path: |
            .trust_ecg_runtime/primary
            .trust_ecg_runtime/evidence
            .trust_ecg_runtime/work
          key: ${{ steps.frozen.outputs.data_cache_key }}
          fail-on-cache-miss: true

      - name: Restore completed primary ResNet state
        uses: actions/cache/restore@v4
        with:
          path: .trust_ecg_runtime/results
          key: ${{ inputs.result_cache_key }}
          fail-on-cache-miss: true

      - name: Install deterministic CPU analysis runtime
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu "torch==2.13.0"
          pip install -e ".[ecg-deep,reporting]"
          python - <<'PY'
          import torch
          print("torch", torch.__version__)
          print("cuda_available", torch.cuda.is_available())
          if torch.cuda.is_available():
              raise SystemExit("Statistical addendum must remain CPU-only.")
          PY

      - name: Verify uncontaminated completed primary state
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          root = Path(os.environ["RESULTS_ROOT"])
          required = [
              "open_ecg_phase0_resnet_report.json",
              "open_ecg_resnet_checkpoint.pt",
              "open_ecg_resnet_calibration.json",
              "open_ecg_resnet_training_history.json",
          ]
          for name in required:
              if not (root / name).is_file():
                  raise SystemExit(f"Missing completed primary file: {name}")
          report = json.loads((root / required[0]).read_text())
          history = json.loads((root / required[3]).read_text())
          expected_labels = [
              "59118001", "164889003", "164909002", "270492004",
              "284470004", "426783006", "427084000",
          ]
          if report["primary_gate_eligible"] is not True:
              raise SystemExit("Primary model is not gate eligible.")
          if report["external_recovery_pool_used"] is not False:
              raise SystemExit("Recovery-pool contamination detected in Phase 0.")
          if report["label_codes"] != expected_labels:
              raise SystemExit("Locked label order changed.")
          if history.get("execution_mode") != "batch_resumable_cpu_exact_state":
              raise SystemExit("Completed primary did not use the exact resumable execution mode.")
          PY

      - name: Compute aggregate-only publication statistics
        run: |
          set -euo pipefail
          rm -rf "$ADDENDUM_ROOT"
          mkdir -p "$ADDENDUM_ROOT"
          python scripts/run_open_ecg_statistical_addendum_audited.py \
            --phase0-report "$RESULTS_ROOT/open_ecg_phase0_resnet_report.json" \
            --primary-data-root "$DATA_ROOT" \
            --model-index "$WORK_ROOT/model_index/open_ecg_model_index.csv" \
            --model-index-audit "$WORK_ROOT/model_index/open_ecg_model_index_audit.json" \
            --label-manifest "$EVIDENCE_ROOT/open_ecg_label_manifest.json" \
            --normalization-stats "$WORK_ROOT/waveform/open_ecg_normalization_stats.json" \
            --checkpoint "$RESULTS_ROOT/open_ecg_resnet_checkpoint.pt" \
            --global-calibration "$RESULTS_ROOT/open_ecg_resnet_calibration.json" \
            --output-root "$ADDENDUM_ROOT" \
            --bootstrap-repeats 2000 --calibration-bins 10 \
            --device cpu --num-workers 0

      - name: Upload aggregate-only reconstruction diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: trust-ecg-statistical-diagnostics-${{ inputs.launch_token }}
          path: .trust_ecg_runtime/statistical_addendum/resnet_metric_reconstruction_audit.csv
          if-no-files-found: ignore
          retention-days: 30

      - name: Validate aggregate-only publication package
        run: |
          python - <<'PY'
          import csv, hashlib, json, os
          from pathlib import Path

          root = Path(os.environ["ADDENDUM_ROOT"])
          required = {
              "trust_ecg_statistical_addendum.json",
              "paired_resnet_logistic_internal.csv",
              "paired_resnet_logistic_external.csv",
              "phase1_matched_method_comparisons.csv",
              "calibration_bins.csv",
              "resnet_metric_reconstruction_audit.csv",
              "internal_calibration.png",
              "internal_calibration.pdf",
              "external_candidate_calibration.png",
              "external_candidate_calibration.pdf",
              "internal_paired_pr_auc_differences.png",
              "internal_paired_pr_auc_differences.pdf",
              "phase1_recovery_curves.png",
              "phase1_recovery_curves.pdf",
              "statistical_addendum_summary.md",
              "aggregate_sha256_manifest.json",
              "source_phase0_resnet_report.json",
              "source_resnet_training_history.json",
              "source_phase1_plan.json",
              "source_phase1_recovery_report.json",
          }
          missing = sorted(name for name in required if not (root / name).is_file())
          if missing:
              raise SystemExit(f"Missing aggregate addendum files: {missing}")
          forbidden_extensions = {".pt", ".pth", ".npy", ".npz", ".mat", ".dat", ".hea"}
          forbidden_headers = {
              "record_id", "patient_id", "raw_prediction", "raw_predictions",
              "logit", "logits", "waveform", "adaptation_index", "adaptation_indices",
          }
          for path in root.rglob("*"):
              if not path.is_file():
                  continue
              if path.suffix.lower() in forbidden_extensions:
                  raise SystemExit(f"Forbidden patient/model-level file in artifact: {path.name}")
              if path.suffix.lower() == ".csv":
                  with path.open(newline="", encoding="utf-8") as handle:
                      headers = set(next(csv.reader(handle)))
                  overlap = headers & forbidden_headers
                  if overlap:
                      raise SystemExit(f"Forbidden record-level CSV columns in {path.name}: {overlap}")
          report_path = root / "trust_ecg_statistical_addendum.json"
          report = json.loads(report_path.read_text())
          if report["privacy"]["record_level_output_persisted"] is not False:
              raise SystemExit("Addendum privacy declaration changed.")
          material = dict(report)
          observed_hash = material["report_sha256"]
          material["report_sha256"] = ""
          encoded = json.dumps(
              material, sort_keys=True, separators=(",", ":"), allow_nan=False
          ).encode()
          if hashlib.sha256(encoded).hexdigest() != observed_hash:
              raise SystemExit("Addendum report SHA-256 verification failed.")
          manifest = json.loads((root / "aggregate_sha256_manifest.json").read_text())
          for name, expected in manifest.items():
              digest = hashlib.sha256((root / name).read_bytes()).hexdigest()
              if digest != expected:
                  raise SystemExit(f"Aggregate file hash mismatch: {name}")
          print("Validated aggregate-only statistical addendum.")
          PY

      - name: Upload aggregate-only statistical addendum
        uses: actions/upload-artifact@v4
        with:
          name: trust-ecg-statistical-addendum-${{ inputs.launch_token }}
          path: .trust_ecg_runtime/statistical_addendum
          if-no-files-found: error
          retention-days: 30

      - name: Record publication statistics summary
        run: |
          cat "$ADDENDUM_ROOT/statistical_addendum_summary.md" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "No record-level predictions, logits, identifiers, waveforms, sampled indices, calibration parameters, or checkpoints were uploaded." >> "$GITHUB_STEP_SUMMARY"

      - name: Delete ephemeral completed-primary cache after validated artifact
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT_CACHE_KEY: ${{ inputs.result_cache_key }}
        run: |
          set +e
          encoded=$(python - <<'PY'
          import os
          from urllib.parse import quote
          print(quote(os.environ["RESULT_CACHE_KEY"], safe=""))
          PY
          )
          gh api --method DELETE \
            "repos/${GITHUB_REPOSITORY}/actions/caches?key=${encoded}&ref=refs/heads/${GITHUB_REF_NAME}"
          exit 0
