name: TRUST-ECG v0.4 Integrity

on:
  push:
    branches: [open-ecg-transportability]
    paths:
      - ".github/workflows/ecg-v04-integrity.yml"
      - "schemas/open_ecg_protocol.yaml"
      - "src/trust_icu/ecg_*.py"
      - "scripts/*ecg*.py"
      - "tests/test_ecg_*.py"
      - "pyproject.toml"
  pull_request:
    paths:
      - "schemas/open_ecg_protocol.yaml"
      - "src/trust_icu/ecg_*.py"
      - "scripts/*ecg*.py"
      - "tests/test_ecg_*.py"
      - "pyproject.toml"

permissions:
  contents: read

jobs:
  v04-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install lightweight validation runtime
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint ECG implementation
        run: ruff check src/trust_icu/ecg_*.py scripts/*ecg*.py tests/test_ecg_*.py

      - name: Validate protocol v0.4
        run: python scripts/validate_open_ecg_protocol.py

      - name: Validate v0.4 header evidence plan
        run: python scripts/fetch_open_ecg_headers.py --dry-run --skip-original-ptbxl-headers

      - name: Validate authoritative v0.4 waveform fetch plan
        run: python scripts/fetch_open_ecg_primary_waveforms_v04.py --dry-run

      - name: Validate two-source label lock plan
        run: python scripts/lock_open_ecg_labels.py --dry-run

      - name: Validate source-aware waveform audit plan
        run: python scripts/prepare_open_ecg_waveforms.py --dry-run

      - name: Validate source-aware model index plan
        run: python scripts/build_open_ecg_model_index.py --dry-run

      - name: Validate source-aware Phase 0 plans
        run: |
          python scripts/run_open_ecg_phase0.py --model logistic --dry-run
          python scripts/run_open_ecg_phase0.py --model resnet --dry-run

      - name: Run ECG-focused tests
        run: pytest tests/test_ecg_*.py -q

      - name: Guard public API against legacy Phase 0 execution
        run: |
          python - <<'PY'
          import inspect
          import trust_icu
          import trust_icu.ecg_phase0_v04 as v04

          assert trust_icu.execute_logistic_reference_phase0 is v04.execute_logistic_reference_phase0
          assert trust_icu.load_and_verify_model_index is v04.load_and_verify_model_index
          source = inspect.getsource(trust_icu.execute_logistic_reference_phase0)
          assert 'primary_data_root' in source
          print('v0.4 public ECG execution API is active')
          PY
