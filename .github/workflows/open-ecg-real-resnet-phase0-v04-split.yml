name: Real TRUST-ECG v0.4 Split Fixed ResNet

on:
  push:
    branches: [open-ecg-transportability]
    paths:
      - "triggers/open-ecg-resnet-split/**"
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: trust-ecg-v04-resnet-split-${{ github.ref }}
  cancel-in-progress: false

env:
  ACTIVATION_PATH: triggers/open-ecg-resnet-phase0/activation.json
  RUNTIME_ROOT: ${{ github.workspace }}/.trust_ecg_runtime
  DATA_ROOT: ${{ github.workspace }}/.trust_ecg_runtime/primary
  EVIDENCE_ROOT: ${{ github.workspace }}/.trust_ecg_runtime/evidence
  WORK_ROOT: ${{ github.workspace }}/.trust_ecg_runtime/work
  RESULTS_ROOT: ${{ github.workspace }}/.trust_ecg_runtime/results
  PHASE1_LOCK_SHA: 4b5189d693ddd9ede6715cc3210b9157972144e2

jobs:
  prepare-verified-data:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    outputs:
      data_cache_key: ${{ steps.activation.outputs.data_cache_key }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Resolve activation, provenance, and data-cache key
        id: activation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python scripts/validate_open_ecg_resnet_activation.py --activation "$ACTIVATION_PATH"
          python - "$ACTIVATION_PATH" "$GITHUB_OUTPUT" <<'PY'
          import json, sys
          from pathlib import Path
          p = json.loads(Path(sys.argv[1]).read_text())
          key = (
              "trust-ecg-v04-verified-data-"
              + p["label_manifest_sha256"][:16] + "-"
              + p["waveform_audit_sha256"][:16] + "-"
              + p["model_index_audit_sha256"][:16]
          )
          with Path(sys.argv[2]).open("a", encoding="utf-8") as f:
              f.write(f"data_cache_key={key}\n")
              f.write(f"logistic_sha={p['logistic_head_sha']}\n")
              f.write(f"logistic_run_id={p['logistic_workflow_run_id']}\n")
          PY
          run_id=$(python -c 'import json,os; print(json.load(open(os.environ["ACTIVATION_PATH"]))["logistic_workflow_run_id"])')
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}" > /tmp/logistic_run.json
          python - "$ACTIVATION_PATH" /tmp/logistic_run.json <<'PY'
          import json, sys
          from pathlib import Path
          a = json.loads(Path(sys.argv[1]).read_text())
          r = json.loads(Path(sys.argv[2]).read_text())
          expected = {
              "id": a["logistic_workflow_run_id"],
              "status": "completed",
              "conclusion": "success",
              "head_sha": a["logistic_head_sha"],
              "head_branch": a["logistic_branch"],
              "path": a["logistic_workflow_path"],
          }
          for k, v in expected.items():
              if r.get(k) != v:
                  raise SystemExit(f"Logistic provenance mismatch: {k}: {r.get(k)!r} != {v!r}")
          print("Verified successful Logistic reference run.")
          PY

      - name: Guard frozen scientific implementation
        env:
          LOGISTIC_SHA: ${{ steps.activation.outputs.logistic_sha }}
        run: |
          set -euo pipefail
          phase0_protected=(
            pyproject.toml
            schemas/open_ecg_protocol.yaml
            src/trust_icu/ecg_baseline.py
            src/trust_icu/ecg_index.py
            src/trust_icu/ecg_manifest.py
            src/trust_icu/ecg_phase0.py
            src/trust_icu/ecg_phase0_v04.py
            src/trust_icu/ecg_deep_phase0.py
            src/trust_icu/ecg_deep_phase0_v04.py
            src/trust_icu/ecg_resnet.py
            src/trust_icu/ecg_signal.py
            src/trust_icu/ecg_waveform.py
            scripts/audit_original_ptbxl_labels.py
            scripts/build_open_ecg_model_index.py
            scripts/fetch_open_ecg_headers.py
            scripts/fetch_open_ecg_primary_waveforms_v04.py
            scripts/lock_open_ecg_labels.py
            scripts/prepare_open_ecg_data.py
            scripts/prepare_open_ecg_waveforms.py
            scripts/run_open_ecg_phase0.py
          )
          git diff --quiet "$LOGISTIC_SHA" "$GITHUB_SHA" -- "${phase0_protected[@]}" || {
            echo "Scientific Phase 0 implementation drift detected." >&2
            git diff --name-only "$LOGISTIC_SHA" "$GITHUB_SHA" -- "${phase0_protected[@]}" >&2
            exit 1
          }
          phase1_protected=(src/trust_icu/ecg_phase1.py scripts/run_open_ecg_phase1.py)
          git diff --quiet "$PHASE1_LOCK_SHA" "$GITHUB_SHA" -- "${phase1_protected[@]}" || {
            echo "Scientific Phase 1 implementation drift detected." >&2
            git diff --name-only "$PHASE1_LOCK_SHA" "$GITHUB_SHA" -- "${phase1_protected[@]}" >&2
            exit 1
          }
          echo "Frozen Phase 0 and Phase 1 implementation verified."

      - name: Restore exact verified-data cache if present
        id: data_cache
        uses: actions/cache/restore@v4
        with:
          path: |
            .trust_ecg_runtime/primary
            .trust_ecg_runtime/evidence
            .trust_ecg_runtime/work
          key: ${{ steps.activation.outputs.data_cache_key }}

      - name: Install waveform verification runtime
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[ecg-waveform]"

      - name: Build exact public waveform state on cache miss
        if: steps.data_cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          rm -rf "$RUNTIME_ROOT"
          mkdir -p "$EVIDENCE_ROOT"
          curl --fail --location --retry 8 --retry-all-errors --retry-delay 2 \
            --output "$EVIDENCE_ROOT/ptbxl_database.csv" \
            https://physionet.org/files/ptb-xl/1.0.1/ptbxl_database.csv
          test -s "$EVIDENCE_ROOT/ptbxl_database.csv"
          python scripts/fetch_open_ecg_headers.py \
            --output-root "$EVIDENCE_ROOT" --workers 8 --recovery-rounds 4 \
            --skip-original-ptbxl-headers \
            --summary "$EVIDENCE_ROOT/header_download_summary.json"
          python scripts/prepare_open_ecg_data.py \
            --header-root "$EVIDENCE_ROOT/challenge" \
            --ptbxl-metadata "$EVIDENCE_ROOT/ptbxl_database.csv" \
            --output "$EVIDENCE_ROOT/open_ecg_header_audit.json" --require-ready
          python scripts/audit_original_ptbxl_labels.py \
            --ptbxl-metadata "$EVIDENCE_ROOT/ptbxl_database.csv" \
            --output "$EVIDENCE_ROOT/ptbxl_label_concordance_audit.json" --require-ready
          python scripts/lock_open_ecg_labels.py \
            --header-audit "$EVIDENCE_ROOT/open_ecg_header_audit.json" \
            --ptbxl-label-concordance "$EVIDENCE_ROOT/ptbxl_label_concordance_audit.json" \
            --output "$EVIDENCE_ROOT/open_ecg_label_manifest.json"
          mkdir -p "$DATA_ROOT/ptb-xl"
          cp "$EVIDENCE_ROOT/ptbxl_database.csv" "$DATA_ROOT/ptb-xl/ptbxl_database.csv"
          for source in georgia cpsc_2018 cpsc_2018_extra; do
            cp -a "$EVIDENCE_ROOT/challenge/${source}" "$DATA_ROOT/${source}"
          done
          python scripts/fetch_open_ecg_primary_waveforms_v04.py \
            --output-root "$DATA_ROOT" --workers 4 --recovery-rounds 4 \
            --summary "$DATA_ROOT/waveform_download_summary.json"
          python scripts/prepare_open_ecg_waveforms.py \
            --primary-data-root "$DATA_ROOT" \
            --ptbxl-metadata "$DATA_ROOT/ptb-xl/ptbxl_database.csv" \
            --header-audit "$EVIDENCE_ROOT/open_ecg_header_audit.json" \
            --label-manifest "$EVIDENCE_ROOT/open_ecg_label_manifest.json" \
            --output-root "$WORK_ROOT/waveform" --require-ready
          python scripts/build_open_ecg_model_index.py \
            --primary-data-root "$DATA_ROOT" \
            --ptbxl-metadata "$DATA_ROOT/ptb-xl/ptbxl_database.csv" \
            --waveform-audit "$WORK_ROOT/waveform/open_ecg_waveform_audit.json" \
            --label-manifest "$EVIDENCE_ROOT/open_ecg_label_manifest.json" \
            --ptbxl-assignment "$WORK_ROOT/waveform/ptbxl_verified_assignment.csv" \
            --output-root "$WORK_ROOT/model_index"

      - name: Re-verify cached or newly prepared state against activation
        run: |
          set -euo pipefail
          test -f "$EVIDENCE_ROOT/open_ecg_header_audit.json"
          test -f "$EVIDENCE_ROOT/ptbxl_label_concordance_audit.json"
          test -f "$EVIDENCE_ROOT/open_ecg_label_manifest.json"
          test -f "$WORK_ROOT/waveform/open_ecg_waveform_audit.json"
          test -f "$WORK_ROOT/model_index/open_ecg_model_index_audit.json"
          rm -rf "$WORK_ROOT/reverify_waveform" "$WORK_ROOT/reverify_index"
          python scripts/prepare_open_ecg_waveforms.py \
            --primary-data-root "$DATA_ROOT" \
            --ptbxl-metadata "$DATA_ROOT/ptb-xl/ptbxl_database.csv" \
            --header-audit "$EVIDENCE_ROOT/open_ecg_header_audit.json" \
            --label-manifest "$EVIDENCE_ROOT/open_ecg_label_manifest.json" \
            --output-root "$WORK_ROOT/reverify_waveform" --require-ready
          python scripts/build_open_ecg_model_index.py \
            --primary-data-root "$DATA_ROOT" \
            --ptbxl-metadata "$DATA_ROOT/ptb-xl/ptbxl_database.csv" \
            --waveform-audit "$WORK_ROOT/reverify_waveform/open_ecg_waveform_audit.json" \
            --label-manifest "$EVIDENCE_ROOT/open_ecg_label_manifest.json" \
            --ptbxl-assignment "$WORK_ROOT/reverify_waveform/ptbxl_verified_assignment.csv" \
            --output-root "$WORK_ROOT/reverify_index"
          python - <<'PY'
          import json, os
          from pathlib import Path
          a = json.loads(Path(os.environ["ACTIVATION_PATH"]).read_text())
          e = Path(os.environ["EVIDENCE_ROOT"])
          w = Path(os.environ["WORK_ROOT"])
          header = json.loads((e / "open_ecg_header_audit.json").read_text())
          concordance = json.loads((e / "ptbxl_label_concordance_audit.json").read_text())
          manifest = json.loads((e / "open_ecg_label_manifest.json").read_text())
          waveform = json.loads((w / "reverify_waveform/open_ecg_waveform_audit.json").read_text())
          index = json.loads((w / "reverify_index/open_ecg_model_index_audit.json").read_text())
          observed = {
              "header_audit_sha256": header["manifest_sha256"],
              "ptbxl_label_concordance_audit_sha256": concordance["audit_sha256"],
              "label_manifest_sha256": manifest["manifest_sha256"],
              "waveform_audit_sha256": waveform["audit_sha256"],
              "normalization_stats_sha256": waveform["normalization_stats_sha256"],
              "ptbxl_assignment_sha256": waveform["ptbxl_assignment_sha256"],
              "model_index_sha256": index["index_sha256"],
              "model_index_audit_sha256": index["audit_sha256"],
              "label_codes": index["label_codes"],
          }
          for k, v in observed.items():
              if a[k] != v:
                  raise SystemExit(f"Verified-data mismatch for {k}: {v!r} != {a[k]!r}")
          if index.get("challenge_ptbxl_model_input") is not False:
              raise SystemExit("Challenge-renamed PTB-XL unexpectedly entered model input.")
          print("Exact v0.4 verified-data state reproduced.")
          PY
          rm -rf "$WORK_ROOT/waveform" "$WORK_ROOT/model_index"
          mv "$WORK_ROOT/reverify_waveform" "$WORK_ROOT/waveform"
          mv "$WORK_ROOT/reverify_index" "$WORK_ROOT/model_index"
          du -sh "$DATA_ROOT" "$EVIDENCE_ROOT" "$WORK_ROOT"

      - name: Save deterministic verified-data cache
        if: steps.data_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            .trust_ecg_runtime/primary
            .trust_ecg_runtime/evidence
            .trust_ecg_runtime/work
          key: ${{ steps.activation.outputs.data_cache_key }}

      - name: Record preparation summary
        run: |
          {
            echo "# TRUST-ECG v0.4 verified-data preparation"
            echo
            echo "- Scientific model/protocol changed: **false**"
            echo "- Exact activation-state re-verification: **passed**"
            echo "- Cache hit: **${{ steps.data_cache.outputs.cache-hit }}**"
            echo "- Data cache key: \`${{ steps.activation.outputs.data_cache_key }}\`"
            echo "- Challenge-renamed PTB-XL model input: **false**"
            echo "- No waveform or checkpoint is published as a workflow artifact."
          } >> "$GITHUB_STEP_SUMMARY"

  primary-fixed-resnet:
    needs: prepare-verified-data
    runs-on: ubuntu-latest
    timeout-minutes: 360
    outputs:
      model_cache_key: ${{ steps.primary.outputs.model_cache_key }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Validate frozen execution state
        run: |
          set -euo pipefail
          python scripts/validate_open_ecg_resnet_activation.py --activation "$ACTIVATION_PATH"
          LOGISTIC_SHA=$(python -c 'import json,os; print(json.load(open(os.environ["ACTIVATION_PATH"]))["logistic_head_sha"])')
          phase0_protected=(
            pyproject.toml schemas/open_ecg_protocol.yaml
            src/trust_icu/ecg_baseline.py src/trust_icu/ecg_index.py src/trust_icu/ecg_manifest.py
            src/trust_icu/ecg_phase0.py src/trust_icu/ecg_phase0_v04.py
            src/trust_icu/ecg_deep_phase0.py src/trust_icu/ecg_deep_phase0_v04.py
            src/trust_icu/ecg_resnet.py src/trust_icu/ecg_signal.py src/trust_icu/ecg_waveform.py
            scripts/audit_original_ptbxl_labels.py scripts/build_open_ecg_model_index.py
            scripts/fetch_open_ecg_headers.py scripts/fetch_open_ecg_primary_waveforms_v04.py
            scripts/lock_open_ecg_labels.py scripts/prepare_open_ecg_data.py
            scripts/prepare_open_ecg_waveforms.py scripts/run_open_ecg_phase0.py
          )
          git diff --quiet "$LOGISTIC_SHA" "$GITHUB_SHA" -- "${phase0_protected[@]}" || exit 1
          phase1_protected=(src/trust_icu/ecg_phase1.py scripts/run_open_ecg_phase1.py)
          git diff --quiet "$PHASE1_LOCK_SHA" "$GITHUB_SHA" -- "${phase1_protected[@]}" || exit 1

      - name: Restore exact verified data
        uses: actions/cache/restore@v4
        with:
          path: |
            .trust_ecg_runtime/primary
            .trust_ecg_runtime/evidence
            .trust_ecg_runtime/work
          key: ${{ needs.prepare-verified-data.outputs.data_cache_key }}
          fail-on-cache-miss: true

      - name: Install fixed-ResNet runtime
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[ecg-deep]"
          python - <<'PY'
          import torch
          print("torch", torch.__version__)
          print("cuda_available", torch.cuda.is_available())
          PY

      - name: Re-verify restored waveform state
        run: |
          set -euo pipefail
          rm -rf "$WORK_ROOT/train_verify_waveform" "$WORK_ROOT/train_verify_index"
          python scripts/prepare_open_ecg_waveforms.py \
            --primary-data-root "$DATA_ROOT" \
            --ptbxl-metadata "$DATA_ROOT/ptb-xl/ptbxl_database.csv" \
            --header-audit "$EVIDENCE_ROOT/open_ecg_header_audit.json" \
            --label-manifest "$EVIDENCE_ROOT/open_ecg_label_manifest.json" \
            --output-root "$WORK_ROOT/train_verify_waveform" --require-ready
          python scripts/build_open_ecg_model_index.py \
            --primary-data-root "$DATA_ROOT" \
            --ptbxl-metadata "$DATA_ROOT/ptb-xl/ptbxl_database.csv" \
            --waveform-audit "$WORK_ROOT/train_verify_waveform/open_ecg_waveform_audit.json" \
            --label-manifest "$EVIDENCE_ROOT/open_ecg_label_manifest.json" \
            --ptbxl-assignment "$WORK_ROOT/train_verify_waveform/ptbxl_verified_assignment.csv" \
            --output-root "$WORK_ROOT/train_verify_index"
          python - <<'PY'
          import json, os
          from pathlib import Path
          a = json.loads(Path(os.environ["ACTIVATION_PATH"]).read_text())
          e = Path(os.environ["EVIDENCE_ROOT"]); w = Path(os.environ["WORK_ROOT"])
          header = json.loads((e / "open_ecg_header_audit.json").read_text())
          concordance = json.loads((e / "ptbxl_label_concordance_audit.json").read_text())
          manifest = json.loads((e / "open_ecg_label_manifest.json").read_text())
          waveform = json.loads((w / "train_verify_waveform/open_ecg_waveform_audit.json").read_text())
          index = json.loads((w / "train_verify_index/open_ecg_model_index_audit.json").read_text())
          observed = {
              "header_audit_sha256": header["manifest_sha256"],
              "ptbxl_label_concordance_audit_sha256": concordance["audit_sha256"],
              "label_manifest_sha256": manifest["manifest_sha256"],
              "waveform_audit_sha256": waveform["audit_sha256"],
              "normalization_stats_sha256": waveform["normalization_stats_sha256"],
              "ptbxl_assignment_sha256": waveform["ptbxl_assignment_sha256"],
              "model_index_sha256": index["index_sha256"],
              "model_index_audit_sha256": index["audit_sha256"],
              "label_codes": index["label_codes"],
          }
          for k, v in observed.items():
              if a[k] != v:
                  raise SystemExit(f"Training-state mismatch for {k}: {v!r} != {a[k]!r}")
          if index.get("challenge_ptbxl_model_input") is not False:
              raise SystemExit("Challenge-renamed PTB-XL unexpectedly entered model input.")
          PY
          rm -rf "$WORK_ROOT/waveform" "$WORK_ROOT/model_index"
          mv "$WORK_ROOT/train_verify_waveform" "$WORK_ROOT/waveform"
          mv "$WORK_ROOT/train_verify_index" "$WORK_ROOT/model_index"

      - name: Run primary fixed ResNet Phase 0
        run: |
          set -euo pipefail
          rm -rf "$RESULTS_ROOT"
          mkdir -p "$RESULTS_ROOT"
          python scripts/run_open_ecg_phase0.py \
            --model resnet \
            --primary-data-root "$DATA_ROOT" \
            --model-index "$WORK_ROOT/model_index/open_ecg_model_index.csv" \
            --model-index-audit "$WORK_ROOT/model_index/open_ecg_model_index_audit.json" \
            --label-manifest "$EVIDENCE_ROOT/open_ecg_label_manifest.json" \
            --waveform-audit "$WORK_ROOT/waveform/open_ecg_waveform_audit.json" \
            --normalization-stats "$WORK_ROOT/waveform/open_ecg_normalization_stats.json" \
            --output-root "$RESULTS_ROOT" --device cpu --num-workers 2

      - name: Validate primary result and derive ephemeral transfer key
        id: primary
        run: |
          python - "$RESULTS_ROOT" "$GITHUB_OUTPUT" <<'PY'
          import json, sys
          from pathlib import Path
          root = Path(sys.argv[1])
          report = json.loads((root / "open_ecg_phase0_resnet_report.json").read_text())
          history = json.loads((root / "open_ecg_resnet_training_history.json").read_text())
          calibration = json.loads((root / "open_ecg_resnet_calibration.json").read_text())
          expected = ["59118001","164889003","164909002","270492004","284470004","426783006","427084000"]
          if report["primary_gate_eligible"] is not True: raise SystemExit("Primary gate flag changed.")
          if report["external_recovery_pool_used"] is not False: raise SystemExit("Recovery pool used in Phase 0.")
          if list(report["label_codes"]) != expected: raise SystemExit("Locked label order changed.")
          key = "trust-ecg-v04-ephemeral-primary-" + report["model_sha256"][:20] + "-" + report["report_sha256"][:20]
          with Path(sys.argv[2]).open("a", encoding="utf-8") as f: f.write(f"model_cache_key={key}\n")
          print("best_epoch", history["best_epoch"])
          print("best_fold8_macro_pr_auc", history["best_fold8_macro_pr_auc"])
          print("model_sha256", report["model_sha256"])
          print("report_sha256", report["report_sha256"])
          print("calibration_sha256", calibration["sha256"])
          PY

      - name: Save ephemeral primary state for Phase 1
        uses: actions/cache/save@v4
        with:
          path: .trust_ecg_runtime/results
          key: ${{ steps.primary.outputs.model_cache_key }}

      - name: Record aggregate-only primary summary
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          r = Path(os.environ["RESULTS_ROOT"])
          report = json.loads((r / "open_ecg_phase0_resnet_report.json").read_text())
          hist = json.loads((r / "open_ecg_resnet_training_history.json").read_text())
          cal = json.loads((r / "open_ecg_resnet_calibration.json").read_text())
          lines = [
            "# TRUST-ECG v0.4 split primary ResNet", "",
            f"- Primary-gate eligible: **{report['primary_gate_eligible']}**",
            f"- Recovery pool used in Phase 0: **{report['external_recovery_pool_used']}**",
            f"- Internal macro PR-AUC: **{report['internal_test']['macro_pr_auc']:.6f}**",
            f"- Best fold-8 epoch: **{hist['best_epoch']}**",
            f"- Best fold-8 macro PR-AUC: **{hist['best_fold8_macro_pr_auc']:.6f}**",
            f"- Epochs completed: **{hist['epochs_completed']}**",
            f"- Model SHA-256: `{report['model_sha256']}`",
            f"- Report SHA-256: `{report['report_sha256']}`",
            f"- Calibration SHA-256: `{cal['sha256']}`",
            "", "No waveform/checkpoint/prediction is published as a workflow artifact."
          ]
          Path(os.environ["GITHUB_STEP_SUMMARY"]).write_text("\n".join(lines) + "\n")
          PY

  conditional-phase1:
    needs: [prepare-verified-data, primary-fixed-resnet]
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Guard frozen Phase 1 implementation
        run: |
          set -euo pipefail
          python scripts/validate_open_ecg_resnet_activation.py --activation "$ACTIVATION_PATH"
          phase1_protected=(src/trust_icu/ecg_phase1.py scripts/run_open_ecg_phase1.py)
          git diff --quiet "$PHASE1_LOCK_SHA" "$GITHUB_SHA" -- "${phase1_protected[@]}" || exit 1

      - name: Restore verified data
        uses: actions/cache/restore@v4
        with:
          path: |
            .trust_ecg_runtime/primary
            .trust_ecg_runtime/evidence
            .trust_ecg_runtime/work
          key: ${{ needs.prepare-verified-data.outputs.data_cache_key }}
          fail-on-cache-miss: true

      - name: Restore ephemeral primary state
        uses: actions/cache/restore@v4
        with:
          path: .trust_ecg_runtime/results
          key: ${{ needs.primary-fixed-resnet.outputs.model_cache_key }}
          fail-on-cache-miss: true

      - name: Install fixed-ResNet runtime
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[ecg-deep]"

      - name: Verify uncontaminated primary state
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          root = Path(os.environ["RESULTS_ROOT"])
          report = json.loads((root / "open_ecg_phase0_resnet_report.json").read_text())
          if report["primary_gate_eligible"] is not True: raise SystemExit("Primary model is not gate eligible.")
          if report["external_recovery_pool_used"] is not False: raise SystemExit("Recovery-pool contamination detected.")
          if not (root / "open_ecg_resnet_checkpoint.pt").is_file(): raise SystemExit("Checkpoint transfer missing.")
          if not (root / "open_ecg_resnet_calibration.json").is_file(): raise SystemExit("Calibration transfer missing.")
          PY

      - name: Run locked conditional Phase 1 probability recovery
        run: |
          set -euo pipefail
          python scripts/run_open_ecg_phase1.py \
            --phase0-report "$RESULTS_ROOT/open_ecg_phase0_resnet_report.json" \
            --plan-output "$RESULTS_ROOT/open_ecg_phase1_plan.json" \
            --primary-data-root "$DATA_ROOT" \
            --model-index "$WORK_ROOT/model_index/open_ecg_model_index.csv" \
            --model-index-audit "$WORK_ROOT/model_index/open_ecg_model_index_audit.json" \
            --label-manifest "$EVIDENCE_ROOT/open_ecg_label_manifest.json" \
            --normalization-stats "$WORK_ROOT/waveform/open_ecg_normalization_stats.json" \
            --checkpoint "$RESULTS_ROOT/open_ecg_resnet_checkpoint.pt" \
            --global-calibration "$RESULTS_ROOT/open_ecg_resnet_calibration.json" \
            --output "$RESULTS_ROOT/open_ecg_phase1_recovery_report.json" \
            --device cpu --num-workers 2

      - name: Emit aggregate-only Phase 1 summary
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          root = Path(os.environ["RESULTS_ROOT"])
          plan = json.loads((root / "open_ecg_phase1_plan.json").read_text())
          lines = [
            "# TRUST-ECG v0.4 conditional Phase 1", "",
            f"- Activated: **{plan['activated']}**",
            f"- Status: `{plan['status']}`",
            f"- Candidate external domains: **{len(plan['candidate_domains'])}**",
            f"- Candidate label-domain pairs: **{len(plan['candidate_pairs'])}**",
            f"- Target-label budgets: `{plan['target_label_budgets']}`",
            f"- Repeats: **{plan['repeats']}**",
            f"- Sampling stratified: **{plan['sampling_stratified']}**",
          ]
          recovery = root / "open_ecg_phase1_recovery_report.json"
          if recovery.is_file():
              p = json.loads(recovery.read_text())
              lines += [
                  f"- Recovery-pool-only execution: **{p['recovery_pool_only']}**",
                  f"- Phase 1 report SHA-256: `{p['report_sha256']}`",
              ]
          lines += ["", "No patient-level or record-level output is published."]
          Path(os.environ["GITHUB_STEP_SUMMARY"]).write_text("\n".join(lines) + "\n")
          PY

      - name: Delete ephemeral primary-state cache
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          MODEL_CACHE_KEY: ${{ needs.primary-fixed-resnet.outputs.model_cache_key }}
        run: |
          set +e
          encoded=$(python - <<'PY'
          import os
          from urllib.parse import quote
          print(quote(os.environ["MODEL_CACHE_KEY"], safe=""))
          PY
          )
          gh api --method DELETE "repos/${GITHUB_REPOSITORY}/actions/caches?key=${encoded}&ref=refs/heads/${GITHUB_REF_NAME}"
          exit 0
