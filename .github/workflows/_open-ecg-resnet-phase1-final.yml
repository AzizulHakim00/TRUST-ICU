name: TRUST-ECG resumable Phase 1 finalization

on:
  workflow_call:
    inputs:
      result_cache_key:
        required: true
        type: string
      expected_head_sha:
        required: true
        type: string
      launch_token:
        required: true
        type: string

permissions:
  contents: read
  actions: write

env:
  ACTIVATION_PATH: triggers/open-ecg-resnet-phase0/activation.json
  RUNTIME_ROOT: ${{ github.workspace }}/.trust_ecg_runtime
  DATA_ROOT: ${{ github.workspace }}/.trust_ecg_runtime/primary
  EVIDENCE_ROOT: ${{ github.workspace }}/.trust_ecg_runtime/evidence
  WORK_ROOT: ${{ github.workspace }}/.trust_ecg_runtime/work
  RESULTS_ROOT: ${{ github.workspace }}/.trust_ecg_runtime/results
  PHASE1_LOCK_SHA: 4b5189d693ddd9ede6715cc3210b9157972144e2

jobs:
  phase1:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.expected_head_sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Guard frozen state and derive verified-data key
        id: activation
        run: |
          set -euo pipefail
          test "$GITHUB_SHA" = "${{ inputs.expected_head_sha }}"
          python scripts/validate_open_ecg_resnet_activation.py --activation "$ACTIVATION_PATH"
          phase1_protected=(src/trust_icu/ecg_phase1.py scripts/run_open_ecg_phase1.py)
          git diff --quiet "$PHASE1_LOCK_SHA" "$GITHUB_SHA" -- "${phase1_protected[@]}" || exit 1
          python - "$ACTIVATION_PATH" "$GITHUB_OUTPUT" <<'PY'
          import json, sys
          from pathlib import Path
          p = json.loads(Path(sys.argv[1]).read_text())
          key = (
              "trust-ecg-v04-verified-data-"
              + p["label_manifest_sha256"][:16] + "-"
              + p["waveform_audit_sha256"][:16] + "-"
              + p["model_index_audit_sha256"][:16]
          )
          with Path(sys.argv[2]).open("a", encoding="utf-8") as handle:
              handle.write(f"data_cache_key={key}\n")
          PY

      - name: Restore exact verified data
        uses: actions/cache/restore@v4
        with:
          path: |
            .trust_ecg_runtime/primary
            .trust_ecg_runtime/evidence
            .trust_ecg_runtime/work
          key: ${{ steps.activation.outputs.data_cache_key }}
          fail-on-cache-miss: true

      - name: Restore completed primary ResNet state
        uses: actions/cache/restore@v4
        with:
          path: .trust_ecg_runtime/results
          key: ${{ inputs.result_cache_key }}
          fail-on-cache-miss: true

      - name: Install CPU-only Phase 1 runtime
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu "torch==2.13.0"
          pip install -e ".[ecg-waveform]"
          python - <<'PY'
          import torch
          print("torch", torch.__version__)
          print("cuda_available", torch.cuda.is_available())
          if torch.cuda.is_available():
              raise SystemExit("Hosted Phase 1 execution must remain CPU-only.")
          PY

      - name: Verify uncontaminated completed primary state
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          root = Path(os.environ["RESULTS_ROOT"])
          report = json.loads((root / "open_ecg_phase0_resnet_report.json").read_text())
          history = json.loads((root / "open_ecg_resnet_training_history.json").read_text())
          calibration = json.loads((root / "open_ecg_resnet_calibration.json").read_text())
          expected = ["59118001","164889003","164909002","270492004","284470004","426783006","427084000"]
          if report["primary_gate_eligible"] is not True:
              raise SystemExit("Primary model is not gate eligible.")
          if report["external_recovery_pool_used"] is not False:
              raise SystemExit("Recovery-pool contamination detected.")
          if list(report["label_codes"]) != expected:
              raise SystemExit("Locked label order changed.")
          if history.get("execution_mode") != "batch_resumable_cpu_exact_state":
              raise SystemExit("Unexpected primary execution mode.")
          if not calibration.get("sha256"):
              raise SystemExit("Primary calibration hash is missing.")
          if not (root / "open_ecg_resnet_checkpoint.pt").is_file():
              raise SystemExit("Primary checkpoint transfer is missing.")
          print("Verified completed, uncontaminated primary ResNet state.")
          PY

      - name: Run locked conditional Phase 1 probability recovery
        run: |
          set -euo pipefail
          python scripts/run_open_ecg_phase1.py \
            --phase0-report "$RESULTS_ROOT/open_ecg_phase0_resnet_report.json" \
            --plan-output "$RESULTS_ROOT/open_ecg_phase1_plan.json" \
            --primary-data-root "$DATA_ROOT" \
            --model-index "$WORK_ROOT/model_index/open_ecg_model_index.csv" \
            --model-index-audit "$WORK_ROOT/model_index/open_ecg_model_index_audit.json" \
            --label-manifest "$EVIDENCE_ROOT/open_ecg_label_manifest.json" \
            --normalization-stats "$WORK_ROOT/waveform/open_ecg_normalization_stats.json" \
            --checkpoint "$RESULTS_ROOT/open_ecg_resnet_checkpoint.pt" \
            --global-calibration "$RESULTS_ROOT/open_ecg_resnet_calibration.json" \
            --output "$RESULTS_ROOT/open_ecg_phase1_recovery_report.json" \
            --device cpu --num-workers 0

      - name: Build publication-oriented aggregate summary
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          root = Path(os.environ["RESULTS_ROOT"])
          report = json.loads((root / "open_ecg_phase0_resnet_report.json").read_text())
          history = json.loads((root / "open_ecg_resnet_training_history.json").read_text())
          calibration = json.loads((root / "open_ecg_resnet_calibration.json").read_text())
          plan = json.loads((root / "open_ecg_phase1_plan.json").read_text())
          lines = [
              "# TRUST-ECG v0.4 completed primary and conditional Phase 1",
              "",
              f"- Primary-gate eligible: **{report['primary_gate_eligible']}**",
              f"- Recovery pool used in Phase 0: **{report['external_recovery_pool_used']}**",
              f"- Internal macro ROC-AUC: **{report['internal_test']['macro_roc_auc']:.6f}**",
              f"- Internal macro PR-AUC: **{report['internal_test']['macro_pr_auc']:.6f}**",
              f"- Internal macro Brier: **{report['internal_test']['macro_brier']:.6f}**",
              f"- Best fold-8 epoch: **{history['best_epoch']}**",
              f"- Best fold-8 macro PR-AUC: **{history['best_fold8_macro_pr_auc']:.6f}**",
              f"- Epochs completed: **{history['epochs_completed']}**",
              f"- Model SHA-256: `{report['model_sha256']}`",
              f"- Report SHA-256: `{report['report_sha256']}`",
              f"- Calibration SHA-256: `{calibration['sha256']}`",
              "",
              "## External certification counts",
          ]
          counts = {}
          for source, labels in report["external_certification"].items():
              local = {}
              for value in labels.values():
                  status = value["status"]
                  local[status] = local.get(status, 0) + 1
                  counts[status] = counts.get(status, 0) + 1
              lines.append(f"- {source}: `{dict(sorted(local.items()))}`")
          lines += [
              f"- Overall: `{dict(sorted(counts.items()))}`",
              "",
              "## Conditional Phase 1",
              f"- Activated: **{plan['activated']}**",
              f"- Status: `{plan['status']}`",
              f"- Candidate domains: **{len(plan['candidate_domains'])}**",
              f"- Candidate label-domain pairs: **{len(plan['candidate_pairs'])}**",
              f"- Target-label budgets: `{plan['target_label_budgets']}`",
              f"- Repeats: **{plan['repeats']}**",
              f"- Sampling stratified: **{plan['sampling_stratified']}**",
          ]
          recovery = root / "open_ecg_phase1_recovery_report.json"
          if recovery.is_file():
              payload = json.loads(recovery.read_text())
              lines += [
                  f"- Recovery-pool-only execution: **{payload['recovery_pool_only']}**",
                  f"- Phase 1 report SHA-256: `{payload['report_sha256']}`",
              ]
          lines += ["", "No patient-level, record-level, waveform, or prediction artifact is published."]
          Path(os.environ["GITHUB_STEP_SUMMARY"]).write_text("\n".join(lines) + "\n")
          PY

      - name: Upload aggregate-only research evidence
        uses: actions/upload-artifact@v4
        with:
          name: trust-ecg-aggregate-results-${{ inputs.launch_token }}
          if-no-files-found: error
          retention-days: 30
          path: |
            .trust_ecg_runtime/results/open_ecg_phase0_resnet_report.json
            .trust_ecg_runtime/results/open_ecg_resnet_training_history.json
            .trust_ecg_runtime/results/open_ecg_phase1_plan.json
            .trust_ecg_runtime/results/open_ecg_phase1_recovery_report.json

      - name: Delete ephemeral completed-primary cache
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT_CACHE_KEY: ${{ inputs.result_cache_key }}
        run: |
          set +e
          encoded=$(python - <<'PY'
          import os
          from urllib.parse import quote
          print(quote(os.environ["RESULT_CACHE_KEY"], safe=""))
          PY
          )
          gh api --method DELETE "repos/${GITHUB_REPOSITORY}/actions/caches?key=${encoded}&ref=refs/heads/${GITHUB_REF_NAME}"
          exit 0
