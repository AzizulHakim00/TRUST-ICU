[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "trust-icu"
version = "0.10.0"
description = "Transportable and risk-controlled prediction of ICU organ-support escalation"
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "TRUST-ICU contributors"}]
dependencies = [
  "numpy>=2.0,<3",
  "pandas>=2.2,<3",
  "pyyaml>=6.0,<7",
  "scikit-learn>=1.6,<2",
]

[project.optional-dependencies]
ml = [
  "catboost>=1.2.10,<2",
]
analytics = [
  "duckdb>=1.5.4,<2",
]
db = [
  "psycopg[binary]>=3.2,<4",
]
phase0 = [
  "catboost>=1.2.10,<2",
  "duckdb>=1.5.4,<2",
]
reporting = [
  "matplotlib>=3.9,<4",
]
dev = [
  "pytest>=8.3,<9",
  "pytest-cov>=6,<7",
  "ruff>=0.9,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q --strict-markers"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
